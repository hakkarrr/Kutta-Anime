<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Kutta Anime - Watch Free Anime Online</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Inter, matching the reference site's typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="preconnect" href="https://image.tmdb.org">
    <link rel="preconnect" href="https://media.kitsu.media">
    <link rel="preconnect" href="https://wsrv.nl">
</head>
<body>
    <div class="app-wrapper">
        <!-- Header -->
        <header class="site-header">
            <div class="container">
                <div class="header-inner">
                    <a href="index.html" id="logo-link" class="logo-link">
                        <img class="logo-icon" src="logo/logo.png" alt=""
                             width="32" height="32" decoding="async">
                        <span>Kutta Anime</span>
                    </a>

                    <div class="search-wrapper">
                        <span class="search-icon">🔍</span>
                        <input
                            type="search"
                            id="search-input"
                            class="search-input"
                            placeholder="Search anime..."
                            autocomplete="off"
                            spellcheck="false"
                        >
                        <div class="search-suggestions" id="search-suggestions"></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Hero + Content.
             The hero is rendered full-bleed by .hero-banner, so it sits
             outside .container; only the rails are container-aligned. -->
        <main class="main-content">
            <div id="hero-container"></div>
            <div class="container">
                <div id="home-content"></div>
            </div>
        </main>
    </div>

<!-- Scripts -->
     <script src="js/utils.js"></script>
     <script src="js/killswitch.js"></script>
     <script src="js/api.js"></script>
     <script src="js/backend-mode.js"></script>
     <script src="js/components.js"></script>
     <script src="js/app.js"></script>
     <script>
        // Curtain handover on the catalogue page.
        //
        // The rails render themselves (#home-content is populated by App), so
        // "ready" here means the first row of real cards exists — not merely
        // that the document loaded, which is what used to drop the user onto a
        // blank page mid-transition.
        (function () {
            if (!Transition.resume()) return;
            const started = Date.now();
            const poll = setInterval(() => {
                const card = document.querySelector("#hero-container .hero-banner, #home-content .rail-card");
                // A cold backend can take a few seconds; give up gracefully and
                // let App's own skeleton placeholders stand in for the content.
                if (card || Date.now() - started > 5000) {
                    clearInterval(poll);
                    Transition.ready();
                }
            }, 60);
        })();
     </script>
</body>
</html>
